<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; }
  .wrap {
    position:absolute; top:50%; left:50%;
    width:100vw; height:56.25vw;          /* 16:9 theo chiều ngang */
    max-height:100vh; max-width:177.78vh; /* nếu vùng thấp hơn thì co lại theo chiều cao */
    transform:translate(-50%,-50%);
  }
  iframe { width:100%; height:100%; border:0; }
</style>
</head>
<body>
<div class="wrap">
  <iframe
    src="https://www.youtube.com/embed/MbXLt7OwEXI?autoplay=1&mute=1&controls=0&loop=1&playlist=ABC123&rel=0"
    allow="autoplay; encrypted-media; fullscreen"
    allowfullscreen>
  </iframe>
</div>
</body>
</html>
